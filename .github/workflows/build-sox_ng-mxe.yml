name: sox_ng krydsbygget med MXE

# MXE (M cross environment) bygger krydstoolchainen og hvert eneste bibliotek
# fra kilde på Linux. Det er den vej sox_ng's egen vedligeholder laver sine
# Windows-exe'er. Prisen er timer, hvor MSYS2-buildet tager minutter; til
# gengæld er hele træet pinnet og reproducerbart, og pakkerne er nye — MXE's
# færdigbyggede apt-pakker er sidst rørt i januar 2021 og kan ikke bruges.
#
# Første kørsel bygger alt. Bagefter ligger mxe/usr i cachen, og senere
# kørsler tager minutter, så længe MXE_COMMIT står stille.
#
# Rækkefølgen er med vilje: alt der kan fejle hurtigt — apt, patches, MXE's
# egen kravkontrol — ligger før det lange build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "sox_ng-version fra Codeberg-releases"
        default: "14.9.0"

env:
  MXE_COMMIT: 98d61fc1fe02dc804320f53804d5231f4a98b6ce
  MXE_TARGET: x86_64-w64-mingw32.static

jobs:
  mxe:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # jobgrænsen hos GitHub er 360

    steps:
      - name: Hent dette repo (patches/)
        uses: actions/checkout@v4

      # Listen er MXE's egen for "Debian and derivatives", taget fra deres
      # docs. libclang-dev er udeladt: den fylder omkring en gigabyte og
      # bruges kun af pakker, vi ikke bygger. Mangler der noget, siger
      # check-requirements nedenfor det, længe før det koster tid.
      - name: Forudsætninger
        run: |
          # ubuntu-24.04-billedet har Microsofts egne apt-kilder med —
          # azure-cli og packages.microsoft.com/ubuntu/24.04/prod. De svarede
          # 403 Forbidden 2026-09-02, og `apt-get update' fejler på hele
          # kørslen, når bare én kilde ikke kan hentes, så trinnet her faldt
          # på noget, buildet slet ikke bruger. Ingen af MXE's afhængigheder
          # kommer derfra; de fjernes frem for at blive hentet.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* \
                     /etc/apt/sources.list.d/azure-cli.*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib \
            gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev \
            libltdl-dev libgl-dev libpcre2-dev libssl-dev libtool-bin \
            libxml-parser-perl lzip make openssl p7zip-full patch perl python3 \
            python3-mako python3-packaging python3-setuptools python-is-python3 \
            ruby sed sqlite3 unzip wget xz-utils

      - name: Hent MXE (pinnet commit)
        run: |
          git clone https://github.com/mxe/mxe.git
          git -C mxe checkout "$MXE_COMMIT"
          git -C mxe log -1 --format="MXE på %h fra %ci"

      # libopusenc manglede i MXE, så workflowet skrev sin egen src/libopusenc.mk
      # her. Den blev sendt opstrøms og merget uændret 2026-08-15 som
      # mxe/mxe#3326, så pakken kommer nu med træet — MXE_COMMIT skal bare være
      # nyt nok. Vagten fejler, hvis pinnet peger på noget ældre, i stedet for
      # at bygge videre uden opus-encoding og først afsløre det i røgtesten.
      - name: Kontrollér at MXE har libopusenc
        run: |
          if [ ! -f mxe/src/libopusenc.mk ]; then
            echo "MXE_COMMIT er ældre end mxe/mxe#3326, hvor libopusenc kom ind."
            echo "Bump det til f514c8e eller nyere."
            exit 1
          fi
          grep -E "_VERSION|_CHECKSUM" mxe/src/libopusenc.mk

      # Ligger før det lange build med vilje: fejler en patch, koster det et
      # minut at opdage i stedet for to timer.
      - name: Hent og lap sox_ng
        run: |
          V="${{ github.event.inputs.version }}"
          wget -q "https://codeberg.org/sox_ng/sox_ng/releases/download/sox_ng-$V/sox_ng-$V.tar.gz"
          tar xzf "sox_ng-$V.tar.gz"
          cd "sox_ng-$V"
          # Fire rettelser, der hidtil kom herfra, ligger i selve releasen nu
          # — se den længere forklaring i MSYS2-workflowet. Patchene ville
          # fejle med "Reversed (or previously applied) patch detected!" eller
          # slet ikke finde deres kontekst, så her kontrolleres blot, at koden
          # er der. Patchfilerne bliver liggende i patches/, men version kan
          # ikke bare sættes tilbage: speex-patchens formats.c-hunks passer kun
          # på 14.9.0's ombrudte fil.
          #
          # 14.8.1 tog win32-glob.c's UTF-8-glob og lsx_popen()'s
          # anførselstegn om filnavnet. 14.9.0 tog opus-encoderen og det
          # udvidede bitrate-interval: dens src/opus.c er byte for byte den
          # fil, workflowet hentede fra main, plus
          # patches/opus-bitrate-range.patch. Encoderen tændes nu af
          # configure selv frem for -DHAVE_OPUSENC.
          grep -q FindFirstFileW src/win32-glob.c
          grep -q "cannot contain" src/util.c
          grep -q HAVE_OPUSENC configure
          grep -q "max_kbps" src/opus.c
          # Native Speex-handler. Uden den kan .spx kun læses, og kun gennem
          # ffmpeg-pipen; med den kan den både læses og skrives af sox_ng
          # selv. Se den lange forklaring i MSYS2-workflowet — det er de samme
          # fem filer, og src/Makefile.in lappes med vilje i stedet for
          # Makefile.am, så ingen automake-regel vågner på et udgivet træ.
          if [ -f src/speex.c ]; then
            echo "sox_ng-$V har selv en speex-handler."
            echo "Fjern denne patch samt -DHAVE_SPEEX og -lspeex -logg i Configure."
            exit 1
          fi
          patch -p1 --fuzz=0 < ../patches/speex-format.patch
          grep -q "LSX_FORMAT_HANDLER(speex)" src/speex.c
          grep -q "FORMAT(speex)" src/formats.h
          grep -q "SOX_ENCODING_SPEEX" src/sox_ng.h
          grep -q "libsox_ng_la-speex.lo" src/Makefile.in
          # MP3 i en RIFF-indpakning (fmt-kode 0x0055), som gamle ACM-encodere
          # og `ffmpeg -c:a libmp3lame -f wav` skriver. Uden patchen siger
          # sox_ng "file encoding 0x0055 (MP3) is not supported", selv om
          # libmad er linket med og kunne have afkodet den. Patchen læser dem,
          # og skriver dem med `-t wavmp3'. Se den lange forklaring i MSYS2-
          # workflowet; det er de samme seks filer, og det er også dér
          # røgtesten ligger, for denne exe kan ikke køres her.
          patch -p1 --fuzz=0 < ../patches/wav-mp3.patch
          grep -q "startread_mpeg_wav" src/wav.c
          grep -q "startwrite_mpeg_wav" src/wav.c
          grep -q "LSX_FORMAT_HANDLER(wavmp3)" src/wav.c
          grep -q "FORMAT(wavmp3)" src/formats.h
          grep -q "data_end" src/sox_ng.h
          grep -q "mad_rewind" src/mp3-mad.c
          grep -q "lame_seek_to_start" src/mp3-lame.c
          # 14.8.1's POSIX sleep(1) i src/waveaudio.c, som GCC 14 afviser,
          # er væk i 14.9.0: hele stedet er skrevet om til en rigtig
          # drain_output(), der venter på waveOut-bufferne i stedet for at
          # sove et sekund. patches/waveaudio-sleep.patch er dermed både
          # unødvendig og uanvendelig — dens kontekst findes ikke mere.
          if grep -qF "sleep(1)" src/waveaudio.c; then
            echo "src/waveaudio.c kalder POSIX sleep(): GCC 14 afviser det."
            echo "Byg 14.9.0 eller nyere, eller læg patches/waveaudio-sleep.patch ind igen."
            exit 1
          fi
          echo "SRC=sox_ng-$V" >> $GITHUB_ENV

      # Nøglen hænger på workflowfilens indhold, ikke kun på MXE-commit'et:
      # Her sad der en cache af mxe/usr. Den er fjernet igen, og det er værd
      # at vide hvorfor, hvis nogen får den samme gode idé:
      #
      #   kørsel 1  23,8 min  koldt
      #   kørsel 2  36,6 min  cache gendannet, alt bygget om alligevel
      #   kørsel 3  32,2 min  koldt igen, gemte 398 MiB
      #   kørsel 4  fejlede   cache gendannet, sdl's CMake fandt ingen gcc
      #
      # MXE's make sammenligner tidsstempler på src/*.mk med stemplerne i
      # usr/$(TARGET)/installed, og git clone giver hver .mk-fil klonetids-
      # punktet som mtime. Alt fra en cache er altså per definition ældre end
      # kilderne, og hele toolchainen bygges om uanset. At røre stemplerne
      # bagefter kan lappe dét, men kørsel 4 viste, at et halvt gendannet
      # MXE-træ også kan vælte pakker, der byggede fint fra bunden.
      #
      # 25-35 minutter der virker, slår en cache der ikke gør.

      # Det dyre trin. -j på tværs af pakker, JOBS inde i hver enkelt: MXE's
      # egen anbefaling, så de to niveauer ikke ganger op til en overtegnet
      # maskine. Runneren har fire kerner.
      # -Os på hele træet. MXE har ingen indbygget hage til det — ordet -Os
      # optræder ikke ét sted i deres Makefile — men hver pakkes configure
      # respekterer CFLAGS fra miljøet, og env: her gælder hele trinnet, så
      # det arves ned i alle byggerier.
      #
      # To forbehold, som kørslen må afgøre: det rammer også selve gcc-
      # bootstrappet, hvor det hverken er tilsigtet eller nyttigt, og
      # CMake-baserede pakker som sdl læser ikke nødvendigvis CFLAGS.
      # Skal det væk igen, er det de to linjer under env: og -Os i
      # Configure-trinnet nedenfor.
      - name: Byg krydstoolchain og codecs
        env:
          CFLAGS: -Os
          CXXFLAGS: -Os
        run: |
          cd mxe
          make check-requirements MXE_TARGETS="$MXE_TARGET"
          # speex er codec'et, speexdsp er preprocessoren bag -agc, -denoise
          # og -dereverb; to forskellige biblioteker med næsten samme navn, og
          # begge skal med. ogg følger allerede med vorbis, men står her,
          # fordi src/speex.c linker den direkte.
          make MXE_TARGETS="$MXE_TARGET" -j$(nproc) JOBS=2 \
            flac lame libmad twolame vorbis opusfile libopusenc wavpack \
            opencore-amr libpng file libltdl mpg123 libid3tag speexdsp \
            speex ogg

      # Samme flag som MSYS2-buildet, med to forskelle. Der er intet
      # -all-static at slås med, fordi MXE's .static-mål kun har statiske
      # biblioteker at linke imod. Og hvor MSYS2-buildet bytter rækkefølgen
      # om inde i configure, står der her et -lopus sidst i LIBS: LIBS lægges
      # sidst på linkerlinjen, og både libopusfile.a og libopusenc.a kalder
      # ind i libopus, som configure selv har sat før dem i OPUS_LIBS.
      #
      # mpg123 i LIBS er LAME 4.0's skyld, som i MSYS2-buildet: configure
      # tester lame med et bart "-lmp3lame", og LAME 4.0 bruger libmpg123, så
      # testlinkningen fejler uden den — hvorefter lame lydløst udgår.
      - name: Configure
        run: |
          set -o pipefail
          export PATH="$PWD/mxe/usr/bin:$PATH"
          cd "$SRC"
          ./configure --host="$MXE_TARGET" \
            --disable-shared --enable-static \
            --without-ao --without-pulseaudio --without-alsa --without-oss --without-sndio \
            --without-sndfile \
            --with-waveaudio \
            --disable-dl-lame --disable-dl-mad --disable-dl-amrnb --disable-dl-amrwb \
            PKG_CONFIG="$MXE_TARGET-pkg-config" \
            CPPFLAGS="-DFLAC__NO_DLL -DLIBTWOLAME_STATIC -DHAVE_SPEEX=1 $($MXE_TARGET-pkg-config --cflags opusfile)" \
            CFLAGS="-Os -ffunction-sections -fdata-sections" \
            LDFLAGS="-Wl,--gc-sections" \
            LIBS="-lopus -lmpg123 -lshlwapi -lspeex -logg" 2>&1 | tee configure.out

      - name: Kontrollér at alle formater kom med
        run: |
          cd "$SRC"
          mangler=""
          for f in flac lpc10 "mp1/mp2/mp3" id3tag lame mad twolame \
                   oggvorbis opus wavpack amrnb amrwb waveaudio; do
            linje=$(grep -E "^ ?$f[ .]" configure.out | head -1 || true)
            case "$linje" in
              *yes*) echo "ok:      $linje" ;;
              *)     echo "MANGLER: $f  [${linje:-ingen linje i opsummeringen}]"
                     mangler="$mangler $f" ;;
            esac
          done
          if [ -n "$mangler" ]; then
            echo "Disse kom ikke med:$mangler"
            exit 1
          fi
          # speexdsp giver effekten af samme navn: -agc, -denoise og -dereverb.
          if ! grep -qE "^speexdsp support\.+yes" configure.out; then
            echo "speexdsp kom ikke med:"
            grep -E "^speexdsp support" configure.out
            exit 1
          fi
          echo "ok:      speexdsp er med"
          # opus-opsummeringen siger kun "yes" til læsedelen: configure leder
          # efter libopusenc uden at skrive et ord om resultatet. Uden den kan
          # .opus stadig læses, så intet format mangler i listen ovenfor —
          # exe'en kan bare ikke skrive .opus. Svaret står i soxconfig.h.
          if ! grep -q "define HAVE_OPUSENC 1" src/soxconfig.h; then
            echo "libopusenc kom ikke med: .opus kan kun læses."
            grep -n "OPUSENC" src/soxconfig.h || true
            exit 1
          fi
          echo "ok:      libopusenc er med, .opus kan skrives"

      # -R .comment fjerner de 865 kopier af "GCC: (GNU) 11.5.0" — én per
      # oversættelsesenhed. Almindelig strip lader dem stå, fordi .comment
      # hverken indlæses eller refereres; det er også derfor --gc-sections
      # ikke rører dem. To forskellige problemer, to forskellige flag.
      - name: Byg
        run: |
          export PATH="$PWD/mxe/usr/bin:$PATH"
          cd "$SRC"
          make -j$(nproc)
          cp src/sox_ng.exe /tmp/ustrippet.exe
          "$MXE_TARGET-strip" -R .comment -R .note src/*.exe
          ls -la src/*.exe
          echo "=== hvad de tre trin hver især gav ==="
          printf "ustrippet:        %s\n" "$(stat -c%s /tmp/ustrippet.exe)"
          printf "strippet:         %s\n" "$(stat -c%s src/sox_ng.exe)"
          printf "GCC-strenge nu:   %s\n" "$(strings -a src/sox_ng.exe | grep -c 'GCC: (GNU)' || true)"
          # Krydsbygget: exe'en kan ikke køres her, så røgtesten i MSYS2-
          # workflowet er den eneste, der rent faktisk prøver Speex af.
          # Til gengæld kan vi se, om handleren overhovedet blev linket med —
          # --gc-sections smider sektioner, der ikke refereres, og havde
          # FORMAT(speex) ikke stået i formats.h, ville hele speex.o ryge
          # lydløst ud, præcis som et bibliotek der ikke blev fundet.
          if ! strings -a src/sox_ng.exe | grep -q "Ogg Speex"; then
            echo "Speex-handleren er ikke i exe'en."
            exit 1
          fi
          echo "ok:               Speex-handleren er med"
          # Samme kontrol for wavmp3-handleren, af samme grund: den er en
          # LSX_FORMAT_HANDLER for sig, og var FORMAT(wavmp3) ikke kommet med
          # i formats.h, ville --gc-sections smide den ud uden at sige noget.
          if ! strings -a src/sox_ng.exe | grep -q "MPEG audio in a Microsoft RIFF wrapper"; then
            echo "wavmp3-handleren er ikke i exe'en."
            exit 1
          fi
          echo "ok:               wavmp3-handleren er med"

      - name: Vis configure-log hvis noget gik galt
        if: failure()
        run: tail -n 60 "$SRC/config.log" || true

      - name: Hvad blev det til
        run: |
          export PATH="$PWD/mxe/usr/bin:$PATH"
          cd "$SRC"
          file src/sox_ng.exe
          echo "=== DLL'er exe'en stadig hænger på ==="
          "$MXE_TARGET-objdump" -p src/sox_ng.exe | grep -i "DLL Name" | sort -u

      - name: Upload færdig exe
        uses: actions/upload-artifact@v4
        with:
          name: sox_ng-win64-mxe
          path: |
            ${{ env.SRC }}/src/*.exe
            ${{ env.SRC }}/configure.out
