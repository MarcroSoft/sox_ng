name: sox_ng krydsbygget med MXE

# MXE (M cross environment) bygger krydstoolchainen og hvert eneste bibliotek
# fra kilde på Linux. Det er den vej sox_ng's egen vedligeholder laver sine
# Windows-exe'er. Prisen er timer, hvor MSYS2-buildet tager minutter; til
# gengæld er hele træet pinnet og reproducerbart, og pakkerne er nye — MXE's
# færdigbyggede apt-pakker er sidst rørt i januar 2021 og kan ikke bruges.
#
# Første kørsel bygger alt. Bagefter ligger mxe/usr i cachen, og senere
# kørsler tager minutter, så længe MXE_COMMIT står stille.
#
# Rækkefølgen er med vilje: alt der kan fejle hurtigt — apt, patches, MXE's
# egen kravkontrol — ligger før det lange build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "sox_ng-version fra Codeberg-releases"
        default: "14.8.0.1"

env:
  MXE_COMMIT: 98d61fc1fe02dc804320f53804d5231f4a98b6ce
  MXE_TARGET: x86_64-w64-mingw32.static

jobs:
  mxe:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # jobgrænsen hos GitHub er 360

    steps:
      - name: Hent dette repo (patches/)
        uses: actions/checkout@v4

      # Listen er MXE's egen for "Debian and derivatives", taget fra deres
      # docs. libclang-dev er udeladt: den fylder omkring en gigabyte og
      # bruges kun af pakker, vi ikke bygger. Mangler der noget, siger
      # check-requirements nedenfor det, længe før det koster tid.
      - name: Forudsætninger
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bash bison bzip2 flex g++ g++-multilib \
            gettext git gperf intltool libc6-dev-i386 libgdk-pixbuf2.0-dev \
            libltdl-dev libgl-dev libpcre2-dev libssl-dev libtool-bin \
            libxml-parser-perl lzip make openssl p7zip-full patch perl python3 \
            python3-mako python3-packaging python3-setuptools python-is-python3 \
            ruby sed sqlite3 unzip wget xz-utils

      - name: Hent MXE (pinnet commit)
        run: |
          git clone https://github.com/mxe/mxe.git
          git -C mxe checkout "$MXE_COMMIT"
          git -C mxe log -1 --format="MXE på %h fra %ci"

      # libopusenc manglede i MXE, så workflowet skrev sin egen src/libopusenc.mk
      # her. Den blev sendt opstrøms og merget uændret 2026-08-15 som
      # mxe/mxe#3326, så pakken kommer nu med træet — MXE_COMMIT skal bare være
      # nyt nok. Vagten fejler, hvis pinnet peger på noget ældre, i stedet for
      # at bygge videre uden opus-encoding og først afsløre det i røgtesten.
      - name: Kontrollér at MXE har libopusenc
        run: |
          if [ ! -f mxe/src/libopusenc.mk ]; then
            echo "MXE_COMMIT er ældre end mxe/mxe#3326, hvor libopusenc kom ind."
            echo "Bump det til f514c8e eller nyere."
            exit 1
          fi
          grep -E "_VERSION|_CHECKSUM" mxe/src/libopusenc.mk

      # Ligger før det lange build med vilje: fejler en patch, koster det et
      # minut at opdage i stedet for to timer.
      - name: Hent og lap sox_ng
        run: |
          V="${{ github.event.inputs.version }}"
          wget -q "https://codeberg.org/sox_ng/sox_ng/releases/download/sox_ng-$V/sox_ng-$V.tar.gz"
          tar xzf "sox_ng-$V.tar.gz"
          cd "sox_ng-$V"
          OPUS_C=5caa22dfc66fea186594cf20c96db2b1362ec00a
          wget -q -O src/opus.c \
            "https://codeberg.org/sox_ng/sox_ng/raw/commit/$OPUS_C/src/opus.c"
          echo "705208e094631e780d20fcfc490f9f98dd5443bb1f777a9b6c792668001ec4ca  src/opus.c" | sha256sum -c -
          patch -p1 --fuzz=0 < ../patches/opus-bitrate-range.patch
          patch -p1 --fuzz=0 < ../patches/win32-glob-utf8.patch
          # Samme grund som i MSYS2-workflowet: lsx_popen() escaper filnavnet
          # med backslash, hvilket hverken cmd.exe eller barnets argv-parser
          # tager som ét argument, så ffmpeg åbner ingenting og pipen er tom.
          # Rammer m4a, der kun kan læses den vej.
          patch -p1 --fuzz=0 < ../patches/ffmpeg-quote-filename.patch
          echo "SRC=sox_ng-$V" >> $GITHUB_ENV

      # Nøglen hænger på workflowfilens indhold, ikke kun på MXE-commit'et:
      # Her sad der en cache af mxe/usr. Den er fjernet igen, og det er værd
      # at vide hvorfor, hvis nogen får den samme gode idé:
      #
      #   kørsel 1  23,8 min  koldt
      #   kørsel 2  36,6 min  cache gendannet, alt bygget om alligevel
      #   kørsel 3  32,2 min  koldt igen, gemte 398 MiB
      #   kørsel 4  fejlede   cache gendannet, sdl's CMake fandt ingen gcc
      #
      # MXE's make sammenligner tidsstempler på src/*.mk med stemplerne i
      # usr/$(TARGET)/installed, og git clone giver hver .mk-fil klonetids-
      # punktet som mtime. Alt fra en cache er altså per definition ældre end
      # kilderne, og hele toolchainen bygges om uanset. At røre stemplerne
      # bagefter kan lappe dét, men kørsel 4 viste, at et halvt gendannet
      # MXE-træ også kan vælte pakker, der byggede fint fra bunden.
      #
      # 25-35 minutter der virker, slår en cache der ikke gør.

      # Det dyre trin. -j på tværs af pakker, JOBS inde i hver enkelt: MXE's
      # egen anbefaling, så de to niveauer ikke ganger op til en overtegnet
      # maskine. Runneren har fire kerner.
      # -Os på hele træet. MXE har ingen indbygget hage til det — ordet -Os
      # optræder ikke ét sted i deres Makefile — men hver pakkes configure
      # respekterer CFLAGS fra miljøet, og env: her gælder hele trinnet, så
      # det arves ned i alle byggerier.
      #
      # To forbehold, som kørslen må afgøre: det rammer også selve gcc-
      # bootstrappet, hvor det hverken er tilsigtet eller nyttigt, og
      # CMake-baserede pakker som sdl læser ikke nødvendigvis CFLAGS.
      # Skal det væk igen, er det de to linjer under env: og -Os i
      # Configure-trinnet nedenfor.
      - name: Byg krydstoolchain og codecs
        env:
          CFLAGS: -Os
          CXXFLAGS: -Os
        run: |
          cd mxe
          make check-requirements MXE_TARGETS="$MXE_TARGET"
          make MXE_TARGETS="$MXE_TARGET" -j$(nproc) JOBS=2 \
            flac lame libmad twolame vorbis opusfile libopusenc wavpack \
            opencore-amr libpng file libltdl mpg123 libid3tag

      # Samme flag som MSYS2-buildet, med to forskelle: der er intet
      # -all-static at slås med, fordi MXE's .static-mål kun har statiske
      # biblioteker at linke imod, og MXE's lame er 4.0 ligesom vores, så
      # mpg123 skal med i LIBS af samme grund som dér.
      - name: Configure
        run: |
          set -o pipefail
          export PATH="$PWD/mxe/usr/bin:$PATH"
          cd "$SRC"
          ./configure --host="$MXE_TARGET" \
            --disable-shared --enable-static \
            --without-ao --without-pulseaudio --without-alsa --without-oss --without-sndio \
            --without-sndfile \
            --with-waveaudio \
            --disable-dl-lame --disable-dl-mad --disable-dl-amrnb --disable-dl-amrwb \
            PKG_CONFIG="$MXE_TARGET-pkg-config" \
            CPPFLAGS="-DFLAC__NO_DLL -DLIBTWOLAME_STATIC -DHAVE_OPUSENC=1 $($MXE_TARGET-pkg-config --cflags opusfile)" \
            CFLAGS="-Os -ffunction-sections -fdata-sections" \
            LDFLAGS="-Wl,--gc-sections" \
            LIBS="-lopusenc -lopus -lmpg123 -lshlwapi" 2>&1 | tee configure.out

      - name: Kontrollér at alle formater kom med
        run: |
          cd "$SRC"
          mangler=""
          for f in flac lpc10 "mp1/mp2/mp3" id3tag lame mad twolame \
                   oggvorbis opus wavpack amrnb amrwb waveaudio; do
            linje=$(grep -E "^ ?$f[ .]" configure.out | head -1 || true)
            case "$linje" in
              *yes*) echo "ok:      $linje" ;;
              *)     echo "MANGLER: $f  [${linje:-ingen linje i opsummeringen}]"
                     mangler="$mangler $f" ;;
            esac
          done
          if [ -n "$mangler" ]; then
            echo "Disse kom ikke med:$mangler"
            exit 1
          fi

      # -R .comment fjerner de 865 kopier af "GCC: (GNU) 11.5.0" — én per
      # oversættelsesenhed. Almindelig strip lader dem stå, fordi .comment
      # hverken indlæses eller refereres; det er også derfor --gc-sections
      # ikke rører dem. To forskellige problemer, to forskellige flag.
      - name: Byg
        run: |
          export PATH="$PWD/mxe/usr/bin:$PATH"
          cd "$SRC"
          make -j$(nproc)
          cp src/sox_ng.exe /tmp/ustrippet.exe
          "$MXE_TARGET-strip" -R .comment -R .note src/*.exe
          ls -la src/*.exe
          echo "=== hvad de tre trin hver især gav ==="
          printf "ustrippet:        %s\n" "$(stat -c%s /tmp/ustrippet.exe)"
          printf "strippet:         %s\n" "$(stat -c%s src/sox_ng.exe)"
          printf "GCC-strenge nu:   %s\n" "$(strings -a src/sox_ng.exe | grep -c 'GCC: (GNU)' || true)"

      - name: Vis configure-log hvis noget gik galt
        if: failure()
        run: tail -n 60 "$SRC/config.log" || true

      - name: Hvad blev det til
        run: |
          export PATH="$PWD/mxe/usr/bin:$PATH"
          cd "$SRC"
          file src/sox_ng.exe
          echo "=== DLL'er exe'en stadig hænger på ==="
          "$MXE_TARGET-objdump" -p src/sox_ng.exe | grep -i "DLL Name" | sort -u

      - name: Upload færdig exe
        uses: actions/upload-artifact@v4
        with:
          name: sox_ng-win64-mxe
          path: |
            ${{ env.SRC }}/src/*.exe
            ${{ env.SRC }}/configure.out
