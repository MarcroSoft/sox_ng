name: sox_ng statisk Windows-build

# Lagt i .github/workflows/ i et hvilket som helst GitHub-repo (må gerne være tomt/privat).
# Kør den manuelt under fanen "Actions" -> "Run workflow".
# Resultatet ligger bagefter som en zip under "Artifacts" nederst på kørslens side.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "sox_ng-version fra Codeberg-releases"
        default: "14.8.0.1"
      replace:
        description: "Byg som sox.exe i stedet for sox_ng.exe"
        type: boolean
        default: false

jobs:
  win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Opsæt MSYS2 + mingw64-toolchain og codec-biblioteker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            wget
            tar
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-wavpack
            mingw-w64-x86_64-twolame
            mingw-w64-x86_64-libid3tag
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-opencore-amr
            mingw-w64-x86_64-gsm

      # MSYS2 pakker stadig lame 3.100 (bygget i 2023), så 4.0 hentes fra kilde
      # og installeres i /mingw64, hvor configure finder den af sig selv.
      #
      # 3.100 skal først af vejen: den kommer ind som afhængighed af libsndfile,
      # der selv følger med toolchainen, og efterlader ellers en importbibliotek
      # som configure ville teste imod i stedet for det 4.0 vi rent faktisk
      # linker. -dd fordi libsndfile stadig peger på den, og vi bruger den ikke.
      #
      # Kun biblioteket: frontend-programmet bruger sox ikke, og det er netop
      # dér 4.0's AIFF-parser-rettelse sidder. --enable-decoder er default, men
      # står eksplicit, fordi sox' mp3-hip.c afhænger af hip_*-API'et — som i
      # 4.0 ikke længere er lames egen mpglib, men et eksternt libmpg123.
      # Derfor også PKG_CONFIG=--static: uden den ender libmp3lame.la med
      # "-lmpg123" alene, og mpg123's eget -lshlwapi mangler i sox' link.
      #
      # sha256 er den samme, som Homebrew opgiver for 4.0.
      - name: Byg LAME 4.0 statisk
        run: |
          pacman -Rdd --noconfirm mingw-w64-x86_64-lame || true
          LAME=lame-4.0
          wget -q "https://downloads.sourceforge.net/lame/$LAME.tar.gz"
          echo "3df5124d5ad3a98312ffd7ba6a9b36230e4f8a3e66d3ce0f425e336c32d216eb  $LAME.tar.gz" | sha256sum -c -
          tar xzf "$LAME.tar.gz"
          cd "$LAME"
          ./configure --prefix=/mingw64 \
            --disable-shared --enable-static \
            --disable-frontend --enable-decoder \
            PKG_CONFIG="pkg-config --static"
          make -j$(nproc)
          make install
          echo "=== installeret (kun .a og .la, ingen .dll.a fra 3.100) ==="
          ls -la /mingw64/lib/libmp3lame.* /mingw64/include/lame/lame.h
          grep -o "dependency_libs=.*" /mingw64/lib/libmp3lame.la
          # version.c lægger "LAME4.0" som fast streng i arkivet; fejler her
          # hvis det alligevel blev en anden udgave der endte i /mingw64.
          strings /mingw64/lib/libmp3lame.a | grep -oE "LAME[0-9]+\.[0-9]+" | sort -u

      - name: Hent kildekode
        run: |
          V="${{ github.event.inputs.version }}"
          wget -q "https://codeberg.org/sox_ng/sox_ng/releases/download/sox_ng-$V/sox_ng-$V.tar.gz"
          tar xzf "sox_ng-$V.tar.gz"
          echo "SRC=sox_ng-$V" >> $GITHUB_ENV

      # configure bygger OPUS_LIBS op som "-lopus -lopusfile". Ved dynamisk link
      # er rækkefølgen ligegyldig, men statisk skal libopusfile stå før libopus:
      # ld scanner arkiverne fra venstre mod højre, og når libopusfile.a først er
      # passeret, kan dens opus_*-referencer ikke længere slås op.
      # grep'en fejler med vilje hvis en senere sox_ng-udgave omskriver linjen.
      - name: Byt om på libopusfile og libopus
        run: |
          cd "$SRC"
          grep -q 'OPUS_LIBS="$OPUS_LIBS -lopusfile"' configure
          sed -i 's|OPUS_LIBS="$OPUS_LIBS -lopusfile"|OPUS_LIBS="-lopusfile $OPUS_LIBS"|' configure

      # --enable-replace laver kun links ved "make install", som vi ikke kører,
      # så exe'en omdøbes i stedet efter build (se nedenfor).
      #
      # CPPFLAGS: FLAC og twolame erklærer deres API som __declspec(dllimport)
      # med mindre man selv definerer FLAC__NO_DLL / LIBTWOLAME_STATIC. Uden dem
      # leder linkeren efter __imp_FLAC__* i .a-filerne og finder ingenting.
      #
      # --without-sndfile: libsndfile.a har sin egen GSM 06.10 med præcis de
      # samme symbolnavne som libgsm, og sox linker altid gsm (wav.c bruger det
      # til WAV GSM 6.10). Statisk kan der kun være én af dem i exe'en.
      #
      # opusfile.h laver #include <opus_multistream.h> i stedet for
      # <opus/opus_multistream.h>, så headeren kun kan oversættes med
      # include/opus i søgestien. configure.ac forsøger selv at rette op på det,
      # men kun ved at omskrive eksisterende -I-flag, og MSYS2 har opus liggende
      # i en standard-includesti uden -I. Uden pkg-config-flaget her ryger opus
      # lydløst ud af buildet.
      #
      # LIBS: configure tester lame med et bart "-lmp3lame", og siden LAME 4.0
      # bruger libmpg123, fejler den testlinkning på mpg123-symboler — hvorefter
      # lame lydløst udgår af buildet. mpg123 og dets shlwapi skal derfor være
      # tilgængelige allerede under configure, ikke først ved den rigtige link.
      - name: Configure
        run: |
          set -o pipefail   # så en fejl i configure ikke skjules af tee
          cd "$SRC"
          ./configure \
            --disable-shared --enable-static \
            --without-ao --without-pulseaudio --without-alsa --without-oss --without-sndio \
            --without-sndfile \
            --with-waveaudio \
            --disable-dl-lame --disable-dl-mad --disable-dl-amrnb --disable-dl-amrwb \
            PKG_CONFIG="pkg-config --static" \
            CPPFLAGS="-DFLAC__NO_DLL -DLIBTWOLAME_STATIC $(pkg-config --cflags opusfile)" \
            LIBS="-lmpg123 -lshlwapi" \
            LDFLAGS="-static-libgcc" 2>&1 | tee configure.out

      # Et bibliotek der ikke kan findes får ikke configure til at fejle — det
      # udgår bare af opsummeringen, og det opdages først når exe'en mangler et
      # format. Både opus og lame er røget ud den vej. Her fejler buildet i
      # stedet med det samme og siger hvad der mangler.
      - name: Kontrollér at alle formater kom med
        run: |
          cd "$SRC"
          mangler=""
          for f in flac gsm lpc10 "mp1/mp2/mp3" id3tag lame mad twolame \
                   oggvorbis opus wavpack amrnb amrwb waveaudio; do
            linje=$(grep -E "^ ?$f[ .]" configure.out | head -1 || true)
            case "$linje" in
              *yes*) echo "ok:      $linje" ;;
              *)     echo "MANGLER: $f  [${linje:-ingen linje i opsummeringen}]"
                     mangler="$mangler $f" ;;
            esac
          done
          if [ -n "$mangler" ]; then
            echo "Disse kom ikke med:$mangler"
            exit 1
          fi

      # Det vigtige trick: libtool sluger et almindeligt "-static" og linker
      # alligevel libgomp/libwinpthread dynamisk. libtools eget "-all-static"
      # ved make-tid er det der faktisk giver en selvstændig exe.
      - name: Byg fuldt statisk
        run: |
          cd "$SRC"
          make -j$(nproc) LDFLAGS="-all-static"
          # play_ng, rec_ng og soxi_ng laves af Makefilens "all:"-mål med
          # $(LN_S), der uden symlinks falder tilbage på cp. De er altså fulde
          # kopier, lavet før dette punkt, og skal strippes hver for sig —
          # ellers ryger tre ustrippede kopier på 12 MB med i zip'en.
          strip src/*.exe
          ls -la src/*.exe
          if [ "${{ github.event.inputs.replace }}" = "true" ]; then
            mv src/sox_ng.exe src/sox.exe
            echo "EXE=sox.exe" >> $GITHUB_ENV
          else
            echo "EXE=sox_ng.exe" >> $GITHUB_ENV
          fi

      - name: Vis configure-log hvis noget gik galt
        if: failure()
        run: tail -n 60 "$SRC/config.log" || true

      - name: Verificér at der kun er system-DLL'er tilbage
        run: |
          cd "$SRC"
          objdump -p "src/$EXE" | grep -i "DLL Name" | sort -u
          echo "Kun KERNEL32/WINMM/msvcrt/SHELL32/SHLWAPI og lign. = fuldt statisk."
          # Kun oplysende: versionsstrengen sidder i version.o, og det statiske
          # link trækker kun de arkivmedlemmer ind, der faktisk bruges, så den
          # behøver ikke være med. Selve versionskontrollen sker på biblioteket.
          echo "=== LAME-versionsstreng i exe'en, hvis den er trukket med ==="
          strings "src/$EXE" | grep -oE "LAME[0-9]+\.[0-9]+" | sort -u || echo "(ikke til stede)"

      - name: Kør en hurtig røgtest
        run: |
          cd "$SRC"
          "./src/$EXE" --version || true
          "./src/$EXE" -n -r 44100 -c 2 test.wav synth 1 sine 440 vol 0.5
          ls -la test.wav
          # soxi_ng er den strippede kopi, og den skifter kun opførsel på
          # argv[0] — så den her viser både at kopien kører, og at den stadig
          # opfører sig som soxi og ikke som sox.
          ./src/soxi_ng.exe test.wav

      - name: Upload færdig exe
        uses: actions/upload-artifact@v4
        with:
          name: sox_ng-win64-static
          path: |
            ${{ env.SRC }}/src/*.exe
            ${{ env.SRC }}/COPYING
            ${{ env.SRC }}/ChangeLog
