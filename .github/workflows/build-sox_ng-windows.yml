name: sox_ng statisk Windows-build

# Lagt i .github/workflows/ i et hvilket som helst GitHub-repo (må gerne være tomt/privat).
# Kør den manuelt under fanen "Actions" -> "Run workflow".
# Resultatet ligger bagefter som en zip under "Artifacts" nederst på kørslens side.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "sox_ng-version fra Codeberg-releases"
        default: "14.8.0.1"
      replace:
        description: "Byg som sox.exe i stedet for sox_ng.exe"
        type: boolean
        default: false

jobs:
  win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # Selve buildet kommer fra en tarball, ikke herfra — men patches/ ligger
      # i dette repo, så det skal checkes ud. Først i rækken, fordi checkout
      # rydder arbejdskataloget.
      - name: Hent dette repo (patches/)
        uses: actions/checkout@v4

      - name: Opsæt MSYS2 + mingw64-toolchain og codec-biblioteker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            wget
            tar
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libmad
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-libopusenc
            mingw-w64-x86_64-wavpack
            mingw-w64-x86_64-twolame
            mingw-w64-x86_64-libid3tag
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-speexdsp
            mingw-w64-x86_64-speex
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-opencore-amr
            mingw-w64-x86_64-lame

      # gsm-pakken er med vilje IKKE på listen, og den må ikke sættes tilbage.
      #
      # libsndfile.a bærer sin egen GSM 06.10 med præcis de symbolnavne, som
      # systemets libgsm også bruger, og sox linker altid en GSM-implementering
      # — wav.c bruger den til WAV GSM 6.10, og configure.ac har ingen knap til
      # at slå den fra. Er begge til stede, dør linket på:
      #
      #   libsndfile.a(gsm_create.c.obj): multiple definition of `gsm_create';
      #   libgsm.a(gsm_create.o): first defined here
      #
      # Uden pacman-pakken finder configure ingen ekstern libgsm og bruger
      # sox' egen kopi i libgsm/ i stedet. Den omdøber alle 39 symboler til
      # lsx_gsm_* gennem libgsm/aliases.h, som gsm.h og private.h inkluderer,
      # så wav.c kalder lsx_gsm_create og libsndfiles gsm_create står alene.
      #
      # Begge dele virker altså samtidig: opsummeringen siger "gsm ... yes
      # (in-tree)" og "sndfile ... yes", og WAV GSM 6.10 kan stadig skrives og
      # læses. Det koster omkring 610 kB, som er libsndfile selv.
      #
      # Kommer gsm-pakken snigende ind som afhængighed af noget andet, vælger
      # configure den eksterne igen, og linket falder med beskeden ovenfor.

      - name: Hent kildekode
        run: |
          V="${{ github.event.inputs.version }}"
          wget -q "https://codeberg.org/sox_ng/sox_ng/releases/download/sox_ng-$V/sox_ng-$V.tar.gz"
          tar xzf "sox_ng-$V.tar.gz"
          echo "SRC=sox_ng-$V" >> $GITHUB_ENV

      # sox_ng har haft native opus-encoding (libopusenc) i main siden oktober
      # 2025, men ingen release har den endnu: i 14.8.0.1 står der stadig NULL
      # i handlerens tre skrive-slots, så .opus kun kan læses. Læsedelen af
      # src/opus.c er linje for linje den samme i main og i releasen, så filen
      # kan skiftes ud hel og holden. Resten af encoderen sidder bag
      # #if HAVE_OPUSENC, som vi definerer i CPPFLAGS nedenfor — så slipper vi
      # for at køre autoreconf på et udgivet træ.
      #
      # Pinnet til en commit frem for main, så et upstream-commit ikke ændrer
      # buildet uden varsel, og med sha256 på filens indhold ligesom LAME.
      - name: Backport opus-encoding fra sox_ng main
        run: |
          cd "$SRC"
          # Den dag en release selv får encoderen med, skal dette trin og de to
          # opusenc-flag i Configure væk igen. Så er det bedre at fejle her end
          # at overskrive en nyere opus.c med den fra main. Testen står på det
          # genererede configure frem for configure.ac, fordi det er det der rent
          # faktisk køres — og fordi trinnet nedenfor allerede regner med det.
          if grep -q HAVE_OPUSENC configure; then
            echo "sox_ng-${{ github.event.inputs.version }} har selv opus-encoding."
            echo "Fjern dette trin samt -DHAVE_OPUSENC og -lopusenc i Configure."
            exit 1
          fi
          OPUS_C=5caa22dfc66fea186594cf20c96db2b1362ec00a
          wget -q -O src/opus.c \
            "https://codeberg.org/sox_ng/sox_ng/raw/commit/$OPUS_C/src/opus.c"
          echo "705208e094631e780d20fcfc490f9f98dd5443bb1f777a9b6c792668001ec4ca  src/opus.c" | sha256sum -c -

      # opus.c's 6-256 kbps var sox_ng's egen husregel. libopus tager alt fra
      # 500 bit/s og skifter selv til SILK og smalbånd, når raten falder;
      # opusenc har samme 500 bit/s i bunden og 1024 kbps per kanal i toppen
      # som sine eneste hårde grænser — dens "6 to 750 kbit/s per channel"
      # står kun i en fejltekst. Patchen overtager opusencs interval.
      #
      # Gulvet bliver 1 kbps, det laveste der kan udtrykkes, når trunc() har
      # taget decimaldelen til complexity. Loftet forsvinder ikke helt: over
      # 300 kbps per kanal klamper libopus alligevel selv, og uden en øvre
      # grænse ville et stort nok -C løbe opus_int32 over.
      #
      # Ligger efter backporten, så sha256'en tjekker den urørte fil.
      - name: Udvid opus' bitrate-interval (-C -1 og opad)
        run: |
          cd "$SRC"
          patch -p1 --fuzz=0 < ../patches/opus-bitrate-range.patch
          grep -q "max_kbps" src/opus.c

      # src/win32-glob.c opremser filer med FindFirstFileA, altså ANSI-udgaven
      # af Windows-API'et, og får navnene tilbage i systemets ANSI-tegnsæt
      # (CP1252 på en dansk maskine). Resten af sox_ng regner filnavne for
      # UTF-8 — det er mingw-w64's CRT, der oversætter både argv og fopen den
      # vej — så `sox_ng *.flac` fejler med "No such file or directory" på
      # ethvert navn med æ, ø eller å i. Tegn, som ANSI-tegnsættet slet ikke
      # har plads til, kommer tilbage som et bogstaveligt '?' og er tabt.
      # Fejlen går begge veje: et mønster med danske tegn matcher ingenting.
      #
      # Patchen skifter til FindFirstFileW og konverterer selv til UTF-8.
      # Meldt opstrøms? Nej — kun her indtil videre.
      - name: Ret glob til UTF-8 (win32-glob.c)
        run: |
          cd "$SRC"
          # --fuzz=0: driver kilden fra hinanden, skal det fejle her og ikke
          # ende som en patch, der lander et tilfældigt sted.
          # Relativ sti, ikke $GITHUB_WORKSPACE: den er en Windows-sti med
          # backslashes, og dem æder bash som escape-tegn.
          patch -p1 --fuzz=0 < ../patches/win32-glob-utf8.patch
          grep -q FindFirstFileW src/win32-glob.c

      # lsx_popen() bygger en kommandolinje til cmd.exe, men cmd er ikke den
      # eneste, der deler den op: bagefter parser barnets eget C-runtime
      # resten til argv og deler igen på mellemrum, der ikke står i citater.
      #
      # 14.8.0.1 escaper med backslash og siger selv i kommentaren "I dunno
      # about Windows". Målt med et program, der udskriver sin argv:
      #
      #   backslash:      argv[2]=[med\]                argv[3]=[mellemrum.m4a]
      #   caret (main):   argv[2]=[med]                 argv[3]=[mellemrum.m4a]
      #   anførselstegn:  argv[2]=[med mellemrum.m4a]
      #
      # ffmpeg får altså to argumenter for én fil, åbner ingen af dem og
      # skriver intet — hvad sox_ng ser som "premature EOF". Det rammer m4a,
      # som kun kan læses gennem ffmpeg-pipen.
      - name: Sæt anførselstegn om filnavnet til ffmpeg (util.c)
        run: |
          cd "$SRC"
          patch -p1 --fuzz=0 < ../patches/ffmpeg-quote-filename.patch
          grep -q "cannot contain" src/util.c

      # speex og speexdsp er to forskellige biblioteker med næsten samme navn.
      # sox_ng har altid brugt speexdsp — det er preprocessoren bag -agc,
      # -denoise og -dereverb — men aldrig selve codec'et. .spx kunne derfor
      # kun læses, og kun gennem ffmpeg-pipen, fordi ffmpeg-handleren i
      # src/ffmpeg.c melder sig på "spx" og "speex" uden at kunne skrive.
      #
      # Patchen lægger en rigtig src/speex.c ind: libogg til containeren,
      # libspeex til codec'et, læsning og skrivning. Den registreres i
      # formats.h før ffmpeg-blokken, så det er den native handler der findes,
      # når endelsen slås op — sox_find_format tager den første der matcher.
      # Dermed kan .spx læses uden en ffmpeg.exe i PATH, og skrives.
      #
      # Fem filer hænger sammen og skal alle med, ellers linker det ikke:
      #   src/speex.c      selve handleren
      #   src/formats.h    FORMAT(speex) bag #if HAVE_SPEEX
      #   src/sox_ng.h     SOX_ENCODING_SPEEX sidst i sox_encoding_t, plus
      #   src/formats.c    den matchende række i s_sox_encodings_info[] —
      #                    et assert_static tæller dem og fejler ellers
      #   src/Makefile.in  objektet og dets oversættelsesregel
      #
      # Makefile.in og ikke Makefile.am med vilje: releasen har allerede
      # kørt automake, og rører man .am-filen, bliver den nyere end .in-filen,
      # hvorefter Makefilens egen vedligeholdsregel prøver at køre automake om
      # på et udgivet træ. Reglen her skriver ingen .Plo-afhængighedsfil, så
      # den behøver heller ikke am--depfiles-maskineriet.
      #
      # configure.ac røres slet ikke; HAVE_SPEEX kommer fra CPPFLAGS nedenfor,
      # på samme måde som HAVE_OPUSENC. Får en senere sox_ng-udgave selv en
      # speex-handler, fejler patchen her frem for at overskrive den.
      - name: Læg native Speex-handler ind (speex.c)
        run: |
          cd "$SRC"
          if [ -f src/speex.c ]; then
            echo "sox_ng-${{ github.event.inputs.version }} har selv en speex-handler."
            echo "Fjern dette trin samt -DHAVE_SPEEX og -lspeex -logg i Configure."
            exit 1
          fi
          patch -p1 --fuzz=0 < ../patches/speex-format.patch
          grep -q "LSX_FORMAT_HANDLER(speex)" src/speex.c
          grep -q "FORMAT(speex)" src/formats.h
          grep -q "SOX_ENCODING_SPEEX" src/sox_ng.h
          grep -q "libsox_ng_la-speex.lo" src/Makefile.in

      # En .wav-fil behøver ikke indeholde PCM. Formatkoden 0x0055 i fmt-
      # chunken betyder, at data-chunken er en almindelig MP3-strøm med en
      # RIFF-indpakning udenom — det er sådan gamle ACM-encodere, Windows'
      # egen lydoptager og `ffmpeg -c:a libmp3lame -f wav` skriver MP3. Indtil
      # nu sagde sox_ng bare:
      #
      #   file encoding 0x0055 (MP3) is not supported
      #
      # og libmad lå lige ved siden af og kunne have afkodet den.
      #
      # Patchen lader wav.c hente mp3-handleren med sox_find_format("mp3") og
      # give den arbejdet — begge veje. Seks filer:
      #   src/wav.c        genkender 0x0055 og 0x0050 (MP1/MP2) ved læsning og
      #                    skriver dem med `-t wavmp3'. Skifter ft->priv ud
      #                    omkring hvert kald ind i mp3-handleren, som ellers
      #                    ville skrive oven i wav'ens egne felter
      #   src/formats.h    FORMAT(wavmp3)
      #   src/mp3-mad.c    spoler tilbage til ft->data_start i stedet for til
      #                    filens begyndelse — ellers lander den i RIFF-
      #                    headeren, både når varigheden skal måles og ved
      #                    `trim`
      #   src/mp3-lame.c   det samme den anden vej: LAME spoler tilbage til
      #                    starten af MPEG-strømmen for at skrive sin Xing-
      #                    ramme, og uden data_start rammer den RIFF-headeren
      #   src/formats_i.c  lsx_readbuf() standser ved ft->data_end
      #   src/sox_ng.h     selve feltet data_end
      #
      # data_end er ikke pynt: uden den læser libmad videre forbi data-chunken
      # ind i en efterfølgende LIST- eller id3-chunk, og starter den tilfældigt
      # med to bytes, der ligner et MPEG-sync-ord, kommer der en ekstra ramme
      # støj ud. Målt: 133632 samples i stedet for 132480.
      #
      # Skrivning er en handler for sig, `wavmp3', og ikke bare et navn mere
      # på wav-handleren. Grunden står i wav.c: listen over encodings en
      # handler kan skrive er også den, sox_ng.c slår op i, når den afgør, om
      # outputfilen bare kan beholde inputfilens encoding. Stod MP3 på
      # wav-handlerens liste, ville `sox_ng x.mp3 x.wav' stille og roligt
      # aflevere en MP3 i en RIFF-indpakning i stedet for den PCM, man bad om.
      # Røgtesten nedenfor holder øje med netop det.
      #
      # Meldt opstrøms? Nej — kun her indtil videre.
      - name: Læs og skriv MP3 i en RIFF-indpakning (wav.c)
        run: |
          cd "$SRC"
          patch -p1 --fuzz=0 < ../patches/wav-mp3.patch
          grep -q "startread_mpeg_wav" src/wav.c
          grep -q "startwrite_mpeg_wav" src/wav.c
          grep -q "LSX_FORMAT_HANDLER(wavmp3)" src/wav.c
          grep -q "FORMAT(wavmp3)" src/formats.h
          grep -q "data_end" src/sox_ng.h
          grep -q "mad_rewind" src/mp3-mad.c
          grep -q "lame_seek_to_start" src/mp3-lame.c

      # configure bygger OPUS_LIBS op som "-lopus -lopusfile". Ved dynamisk link
      # er rækkefølgen ligegyldig, men statisk skal libopusfile stå før libopus:
      # ld scanner arkiverne fra venstre mod højre, og når libopusfile.a først er
      # passeret, kan dens opus_*-referencer ikke længere slås op.
      # grep'en fejler med vilje hvis en senere sox_ng-udgave omskriver linjen.
      - name: Byt om på libopusfile og libopus
        run: |
          cd "$SRC"
          grep -q 'OPUS_LIBS="$OPUS_LIBS -lopusfile"' configure
          sed -i 's|OPUS_LIBS="$OPUS_LIBS -lopusfile"|OPUS_LIBS="-lopusfile $OPUS_LIBS"|' configure

      # --enable-replace laver kun links ved "make install", som vi ikke kører,
      # så exe'en omdøbes i stedet efter build (se nedenfor).
      #
      # CPPFLAGS: FLAC og twolame erklærer deres API som __declspec(dllimport)
      # med mindre man selv definerer FLAC__NO_DLL / LIBTWOLAME_STATIC. Uden dem
      # leder linkeren efter __imp_FLAC__* i .a-filerne og finder ingenting.
      #
      # libsndfile er med — den giver W64, CAF, RF64 og en håndfuld eksotiske
      # formater oveni. Den plads, den koster, står i pacman-listen øverst
      # sammen med forklaringen på, hvorfor gsm-pakken ikke er der: uden den
      # falder sox tilbage på sin egen libgsm, hvis symboler hedder lsx_gsm_*,
      # og så er der ingen konflikt med libsndfiles indbyggede GSM 06.10.
      #
      # opusfile.h laver #include <opus_multistream.h> i stedet for
      # <opus/opus_multistream.h>, så headeren kun kan oversættes med
      # include/opus i søgestien. configure.ac forsøger selv at rette op på det,
      # men kun ved at omskrive eksisterende -I-flag, og MSYS2 har opus liggende
      # i en standard-includesti uden -I. Uden pkg-config-flaget her ryger opus
      # lydløst ud af buildet.
      #
      # LIBS: configure tester lame med et bart "-lmp3lame", og siden LAME 4.0
      # bruger libmpg123, fejler den testlinkning på mpg123-symboler — hvorefter
      # lame lydløst udgår af buildet. mpg123 og dets shlwapi skal derfor være
      # tilgængelige allerede under configure, ikke først ved den rigtige link.
      #
      # -DHAVE_OPUSENC tænder encoderen i den backportede opus.c. Releasens
      # configure kender ikke libopusenc og skriver derfor ingenting om den i
      # soxconfig.h, så #if HAVE_OPUSENC ville ellers stå tom. opusenc.h ligger
      # i include/opus/ og er allerede dækket af --cflags opusfile ovenfor.
      #
      # -lopusenc -lopus i LIBS: LIBS lægges sidst på linkerlinjen, og
      # libopusenc kalder ind i libopus. Statisk scanner ld arkiverne fra
      # venstre, så OPUS_LIBS' eget -lopus er forlængst passeret, når
      # libopusenc.a trækkes ind — derfor skal -lopus gentages bagefter.
      #
      # -DHAVE_SPEEX og -lspeex -logg hører til speex-patchen ovenfor. Samme
      # kneb som opusenc: releasens configure kender ikke libspeex og skriver
      # intet om den i soxconfig.h, så #if HAVE_SPEEX ville stå tom. At de to
      # -l står i LIBS og ikke i et *_LIBS fra configure er netop det, der
      # holder dem sidst på linkerlinjen, hvor libsox_ng.a's referencer til
      # speex_* og ogg_* kan slås op. libspeex kalder ikke selv ind i libogg —
      # det er kun sox' egen speex.c, der bruger begge — så rækkefølgen mellem
      # de to er ligegyldig. libogg er i forvejen med som afhængighed af
      # libvorbis; den står eksplicit i pacman-listen, fordi vi nu linker den
      # direkte og ikke vil have den til at forsvinde, hvis vorbis en dag gør.
      - name: Configure
        run: |
          set -o pipefail   # så en fejl i configure ikke skjules af tee
          cd "$SRC"
          ./configure \
            --disable-shared --enable-static \
            --without-ao --without-pulseaudio --without-alsa --without-oss --without-sndio \
            --with-waveaudio \
            --disable-dl-lame --disable-dl-mad --disable-dl-amrnb --disable-dl-amrwb \
            PKG_CONFIG="pkg-config --static" \
            CPPFLAGS="-DFLAC__NO_DLL -DLIBTWOLAME_STATIC -DHAVE_OPUSENC=1 -DHAVE_SPEEX=1 $(pkg-config --cflags opusfile)" \
            CFLAGS="-Os -ffunction-sections -fdata-sections" \
            LIBS="-lmpg123 -lshlwapi -lopusenc -lopus -lspeex -logg" \
            LDFLAGS="-static-libgcc" 2>&1 | tee configure.out

      # Et bibliotek der ikke kan findes får ikke configure til at fejle — det
      # udgår bare af opsummeringen, og det opdages først når exe'en mangler et
      # format. Både opus og lame er røget ud den vej. Her fejler buildet i
      # stedet med det samme og siger hvad der mangler.
      - name: Kontrollér at alle formater kom med
        run: |
          cd "$SRC"
          mangler=""
          for f in flac gsm lpc10 "mp1/mp2/mp3" id3tag lame mad twolame \
                   oggvorbis opus sndfile wavpack amrnb amrwb waveaudio; do
            linje=$(grep -E "^ ?$f[ .]" configure.out | head -1 || true)
            case "$linje" in
              *yes*) echo "ok:      $linje" ;;
              *)     echo "MANGLER: $f  [${linje:-ingen linje i opsummeringen}]"
                     mangler="$mangler $f" ;;
            esac
          done
          if [ -n "$mangler" ]; then
            echo "Disse kom ikke med:$mangler"
            exit 1
          fi
          # FFTW er fravalgt med vilje: den fylder omkring 4 MB og gjorde kun
          # spektrogrammet hurtigere — `rate` og `sinc` var lige hurtige med og
          # uden, målt mod MXE-buildet, der aldrig har haft den. Kommer den
          # snigende ind igen som afhængighed af en anden pakke, linker
          # configure den uden at sige noget, og filen vokser tilbage.
          # speexdsp giver effekten af samme navn: -agc, -denoise og -dereverb.
          # Den er et bibliotek som alle de andre og kan udgå lige så tavst.
          if ! grep -qE "^speexdsp support\.+yes" configure.out; then
            echo "speexdsp kom ikke med:"
            grep -E "^speexdsp support" configure.out
            exit 1
          fi
          echo "ok:      speexdsp er med"
          if ! grep -qE "^FFTW support\.+no" configure.out; then
            echo "FFTW er tilbage i buildet:"
            grep -E "^FFTW support" configure.out
            exit 1
          fi
          echo "ok:      FFTW er ude, som tilsigtet"

      # Det vigtige trick: libtool sluger et almindeligt "-static" og linker
      # alligevel libgomp/libwinpthread dynamisk. libtools eget "-all-static"
      # ved make-tid er det der faktisk giver en selvstændig exe.
      - name: Byg fuldt statisk
        run: |
          cd "$SRC"
          # --gc-sections skal stå her sammen med -all-static, ikke i
          # configure: LDFLAGS ved make-tid erstatter det, configure gemte, så
          # et flag der kun stod dér ville forsvinde ved den rigtige link.
          # Sektionsopdelingen selv kommer fra -ffunction-sections ovenfor.
          make -j$(nproc) LDFLAGS="-all-static -Wl,--gc-sections"
          # play_ng, rec_ng og soxi_ng laves af Makefilens "all:"-mål med
          # $(LN_S), der uden symlinks falder tilbage på cp. De er altså fulde
          # kopier, lavet før dette punkt, og skal strippes hver for sig —
          # ellers ryger tre ustrippede kopier på 12 MB med i zip'en.
          # -R .comment: almindelig strip lader den sektion stå, og der ligger
          # én kopi af gcc's versionsstreng per oversættelsesenhed. Det fylder
          # ikke noget at tale om, men det støjer i `strings`.
          strip -R .comment -R .note src/*.exe
          ls -la src/*.exe
          echo "GCC-strenge tilbage: $(strings src/sox_ng.exe | grep -c 'GCC: (GNU)' || true)"
          if [ "${{ github.event.inputs.replace }}" = "true" ]; then
            mv src/sox_ng.exe src/sox.exe
            echo "EXE=sox.exe" >> $GITHUB_ENV
          else
            echo "EXE=sox_ng.exe" >> $GITHUB_ENV
          fi

      - name: Vis configure-log hvis noget gik galt
        if: failure()
        run: tail -n 60 "$SRC/config.log" || true

      - name: Verificér at der kun er system-DLL'er tilbage
        run: |
          cd "$SRC"
          objdump -p "src/$EXE" | grep -i "DLL Name" | sort -u
          echo "Kun KERNEL32/WINMM/msvcrt/SHELL32/SHLWAPI og lign. = fuldt statisk."
          # Kun oplysende: versionsstrengen sidder i version.o, og det statiske
          # link trækker kun de arkivmedlemmer ind, der faktisk bruges, så den
          # behøver ikke være med. Selve versionskontrollen sker på biblioteket.
          echo "=== LAME-versionsstreng i exe'en, hvis den er trukket med ==="
          strings "src/$EXE" | grep -oE "LAME[0-9]+\.[0-9]+" | sort -u || echo "(ikke til stede)"

      - name: Kør en hurtig røgtest
        run: |
          cd "$SRC"
          "./src/$EXE" --version || true
          "./src/$EXE" -n -r 44100 -c 2 test.wav synth 1 sine 440 vol 0.5
          ls -la test.wav
          # soxi_ng er den strippede kopi, og den skifter kun opførsel på
          # argv[0] — så den her viser både at kopien kører, og at den stadig
          # opfører sig som soxi og ikke som sox.
          ./src/soxi_ng.exe test.wav
          # Opus-encodingen er det eneste her, der ikke kommer fra releasen, og
          # den har ingen linje i configures opsummering at tjekke imod. Manglede
          # skrive-slottene, ville sox_ng nægte at åbne .opus som output, så
          # rundturen wav -> opus -> wav er det der beviser at backporten
          # virkede. -r 48000 fordi opus-handleren kun tager 8/12/16/24/48 kHz;
          # sox_ng lægger selv et rate-effekt ind. -C 96 = 96 kbps CBR.
          "./src/$EXE" test.wav -C 96 -r 48000 test.opus
          ls -la test.opus
          ./src/soxi_ng.exe test.opus
          "./src/$EXE" test.opus test-rundtur.wav
          ls -la test-rundtur.wav
          # 1 kbps: under sox_ng's eget gamle gulv på 6, og dermed beviset på
          # at bitrate-patchen kom med. -V3 viser hvad encoderen fik at vide.
          "./src/$EXE" -V3 test.wav -C -1 -r 48000 lav.opus
          ls -la lav.opus
          ./src/soxi_ng.exe lav.opus
          "./src/$EXE" lav.opus lav-rundtur.wav
          ls -la lav-rundtur.wav
          # Og over det gamle loft på 256. libopus klamper selv ved 300 per
          # kanal, så filen bliver ikke 400 kbps — pointen er at den skrives.
          "./src/$EXE" -V3 test.wav -C 400 -r 48000 hoej.opus
          ls -la hoej.opus
          ./src/soxi_ng.exe hoej.opus
          # Speex. Skrivning findes kun med patchen ovenfor, og læsning gik før
          # den gennem ffmpeg-pipen. --help-format afslører hvilken handler der
          # svarer på endelsen: står der "Ogg Speex", er det den native; stod
          # der ffmpeg's tekst, havde rækkefølgen i formats.h tabt.
          "./src/$EXE" --help-format spx
          if ! "./src/$EXE" --help-format spx | grep -q "Ogg Speex"; then
            echo "spx besvares ikke af den native handler"
            exit 1
          fi
          # Speex tager kun 8, 16 og 32 kHz uden at brokke sig, så -r 16000;
          # sox_ng lægger selv rate-effekten ind. Rundturen er tabsgivende,
          # men granulepos i sidste Ogg-side siger præcis hvor mange samples
          # der er, og både encoder og decoder skal ramme det tal.
          "./src/$EXE" test.wav -r 16000 roegtest-16k.wav
          "./src/$EXE" roegtest-16k.wav roegtest.spx
          ls -la roegtest.spx
          ./src/soxi_ng.exe roegtest.spx
          "./src/$EXE" roegtest.spx roegtest-rundtur.wav
          ind=$(./src/soxi_ng.exe -s roegtest-16k.wav)
          ud=$(./src/soxi_ng.exe -s roegtest-rundtur.wav)
          echo "samples ind: $ind, ud: $ud"
          if [ "$ind" != "$ud" ]; then
            echo "Speex-rundturen tabte eller tilføjede samples"
            exit 1
          fi
          # Fra en pipe er filen ikke søgbar, så handleren kan hverken læse
          # sidste sides granulepos på forhånd eller spole tilbage. Først
          # kontrolleres at pipe-læsning overhovedet virker i dette miljø —
          # med w64devkit's runtime falder sox_ng's stdin-læsning fra hinanden
          # for alle formater, wav inklusive, og så siger en fejl her intet om
          # Speex. Virker wav, skal spx også virke.
          if cat roegtest-16k.wav | "./src/$EXE" -t wav - pipe-wav.wav 2>/dev/null &&
             [ "$(./src/soxi_ng.exe -s pipe-wav.wav)" = "$ind" ]; then
            cat roegtest.spx | "./src/$EXE" -t spx - pipe-rundtur.wav
            udp=$(./src/soxi_ng.exe -s pipe-rundtur.wav)
            echo "samples fra pipe: $udp"
            if [ "$udp" != "$ud" ]; then
              echo "Speex fra pipe gav $udp samples, fra fil $ud"
              exit 1
            fi
            echo "ok: ogsaa korrekt fra en pipe"
          else
            echo "springer pipe-testen over: stdin-laesning virker ikke her i det hele taget"
          fi
          # -C er pakket som i opus.c: heltalsdelen er kvaliteten 0-10,
          # fortegnet vælger CBR eller VBR (negativ er VBR), og decimaldelen
          # er encoderens complexity 0-10, hvor intet komma betyder 10.
          "./src/$EXE" -V3 roegtest-16k.wav -c 1 -C 3 lav-q.spx
          "./src/$EXE" -V3 roegtest-16k.wav -c 1 -C 10 hoej-q.spx
          "./src/$EXE" -V3 roegtest-16k.wav -c 1 -C -8 vbr.spx
          "./src/$EXE" -V3 roegtest-16k.wav -c 1 -C 8.3 komp3.spx
          "./src/$EXE" -V3 roegtest-16k.wav -c 1 -C 8 komp10.spx
          ls -la lav-q.spx hoej-q.spx vbr.spx komp3.spx komp10.spx
          if [ "$(stat -c%s lav-q.spx)" -ge "$(stat -c%s hoej-q.spx)" ]; then
            echo "-C slår ikke igennem: kvalitet 3 fylder ikke mindre end 10"
            exit 1
          fi
          # Complexity ændrer kun hvor grundigt encoderen søger, ikke bitraten,
          # så de to filer skal fylde det samme og alligevel være forskellige.
          # Var complexity tavst faldet på gulvet, ville de være ens.
          if [ "$(stat -c%s komp3.spx)" != "$(stat -c%s komp10.spx)" ]; then
            echo "complexity ændrede bitraten, hvilket den ikke skal"
            exit 1
          fi
          if cmp -s komp3.spx komp10.spx; then
            echo "-C 8.3 og -C 8 gav samme fil: complexity slår ikke igennem"
            exit 1
          fi
          # Fortegnet skal skifte tilstand; -V3 siger selv hvilken det blev.
          if ! "./src/$EXE" -V3 roegtest-16k.wav -c 1 -C -8 vbr2.spx 2>&1 |
               grep -q "VBR"; then
            echo "-C -8 gav ikke VBR"
            exit 1
          fi
          # Uden for 0-10 skal begge fortegn afvises.
          for ugyldig in 11 -11; do
            if "./src/$EXE" roegtest-16k.wav -C $ugyldig ugyldig.spx 2>/dev/null; then
              echo "-C $ugyldig blev accepteret, men skulle vaere afvist"
              exit 1
            fi
          done
          # MP3 i en RIFF-indpakning, fmt-kode 0x0055. Ingen af de encodere,
          # der er med her, laver sådan en fil, så den bygges i hånden: sox_ng
          # koder lyden til MP3, og resten er ren header. le() skriver et tal
          # ud som rå little-endian bytes. Vejen om ad "%b" og "\0nnn" er den
          # der virker: kommandosubstitutionen giver teksten "000", som printf
          # så laver om til en NUL-byte — omvendt ville NUL'en falde på gulvet
          # undervejs, for kommandosubstitution kan ikke bære den.
          "./src/$EXE" test.wav -C 128 roegtest.mp3
          le() {  # le <tal> <antal bytes>
            local v=$1 n=$2 i
            for ((i = 0; i < n; i++)); do
              printf '%b' "\0$(printf '%03o' $(( (v >> (8 * i)) & 255 )))"
            done
          }
          mp3size=$(stat -c%s roegtest.mp3)
          samples=$(./src/soxi_ng.exe -s test.wav)
          {
            printf 'RIFF'; le $((4 + 8+30 + 8+4 + 8+mp3size)) 4; printf 'WAVE'
            printf 'fmt '; le 30 4
            le 85 2         # wFormatTag = WAVE_FORMAT_MPEGLAYER3
            le 2 2          # nChannels
            le 44100 4      # nSamplesPerSec
            le 16000 4      # nAvgBytesPerSec = 128 kbps
            le 1 2          # nBlockAlign
            le 0 2          # wBitsPerSample: 0, som i alle den slags filer
            le 12 2         # cbSize: resten er MPEGLAYER3WAVEFORMAT
            le 1 2          # wID = MPEGLAYER3_ID_MP3
            le 2 4          # fdwFlags = MPEGLAYER3_FLAG_PADDING_OFF
            le 1 2          # nBlockSize
            le 1 2          # nFramesPerBlock
            le 1393 2       # nCodecDelay
            printf 'fact'; le 4 4; le $((samples / 2)) 4
            printf 'data'; le $mp3size 4
          } > mp3i.wav
          cat roegtest.mp3 >> mp3i.wav
          ./src/soxi_ng.exe mp3i.wav
          if ! ./src/soxi_ng.exe -e mp3i.wav | grep -qi MPEG; then
            echo "0x0055 blev ikke genkendt som MPEG-lyd"
            exit 1
          fi
          # Den samme MP3-strøm med og uden RIFF-indpakningen skal give
          # nøjagtig den samme lyd ud. Det er hele pointen, og det er også
          # den eneste facitliste vi har, når encoderens forsinkelse er med.
          "./src/$EXE" mp3i.wav mp3i-ud.wav
          "./src/$EXE" roegtest.mp3 bar-ud.wav
          echo "samples: indpakket $(./src/soxi_ng.exe -s mp3i-ud.wav), bar $(./src/soxi_ng.exe -s bar-ud.wav)"
          if ! cmp mp3i-ud.wav bar-ud.wav; then
            echo "MP3 i wav gav ikke det samme som den bare mp3"
            exit 1
          fi
          # Og en kopi med en chunk hængt bag data-chunken, fyldt med 0xff,
          # som ligner starten på et MPEG-sync-ord. Uden ft->data_end læser
          # libmad videre ind i den og lægger en ramme støj til.
          cp mp3i.wav mp3i-hale.wav
          { printf 'LIST'; le 44 4; printf 'INFO'
            printf 'ISFT'; le 32 4; head -c 32 /dev/zero | tr '\000' '\377'
          } >> mp3i-hale.wav
          "./src/$EXE" mp3i-hale.wav hale-ud.wav
          if ! cmp hale-ud.wav mp3i-ud.wav; then
            echo "en chunk efter data-chunken slap med ind i lyden"
            exit 1
          fi
          echo "ok: MP3 i RIFF-indpakning, ogsaa med en chunk bagefter"
          # Spoling: seek_wav sender den videre til seek_mad, som tæller
          # rammer fra ft->data_start og ikke fra filens begyndelse.
          "./src/$EXE" mp3i.wav klip-indpakket.wav trim 0.4
          "./src/$EXE" roegtest.mp3 klip-bar.wav trim 0.4
          cmp klip-indpakket.wav klip-bar.wav
          echo "ok: trim rammer det samme sted i begge"

          # Og den anden vej: -t wavmp3 lægger MP3'en i data-chunken selv.
          "./src/$EXE" test.wav -t wavmp3 skriv.wav
          ./src/soxi_ng.exe skriv.wav
          if ! ./src/soxi_ng.exe -e skriv.wav | grep -qi MPEG; then
            echo "-t wavmp3 skrev ikke MPEG-lyd"
            exit 1
          fi
          # Samme lyd som en bar mp3 med samme indstillinger. Det er den
          # eneste facitliste der findes, når encoderens egen forsinkelse er
          # med i tallet, og den viser samtidig at det er den samme encoder.
          "./src/$EXE" test.wav bar.mp3
          "./src/$EXE" skriv.wav skriv-ud.wav
          "./src/$EXE" bar.mp3 bar-mp3-ud.wav
          if ! cmp skriv-ud.wav bar-mp3-ud.wav; then
            echo "-t wavmp3 gav ikke samme lyd som en bar mp3"
            exit 1
          fi
          # VBR. Her spoler LAME tilbage til starten af MPEG-strømmen for at
          # skrive sin Xing-ramme; uden ft->data_start lander den skrivning
          # oven i RIFF-headeren, og så er filen ikke en wav længere.
          "./src/$EXE" test.wav -C -2 -t wavmp3 vbr.wav
          if [ "$(head -c 4 vbr.wav)" != "RIFF" ]; then
            echo "VBR-taggen blev skrevet oven i RIFF-headeren"
            head -c 16 vbr.wav | xxd
            exit 1
          fi
          "./src/$EXE" vbr.wav vbr-ud.wav
          ls -la skriv.wav vbr.wav
          # Og det vigtigste: det her må ikke smitte af på almindelig
          # wav-udskrivning. `sox_ng x.mp3 x.wav` skal stadig give PCM, ikke en
          # MP3 i en RIFF-indpakning. Det er hele grunden til at wavmp3 er en
          # handler for sig.
          "./src/$EXE" bar.mp3 fra-mp3.wav
          if ! ./src/soxi_ng.exe -e fra-mp3.wav | grep -qi "Signed Integer PCM"; then
            echo "mp3 ind gav ikke PCM ud i en almindelig .wav:"
            ./src/soxi_ng.exe fra-mp3.wav
            exit 1
          fi
          echo "ok: -t wavmp3 skriver, og almindelig .wav er uroert"

          # Glob med danske tegn i navnet. Uden win32-glob-patchen får sox_ng
          # navnet tilbage fra Windows i CP1252, mens dens egen fopen venter
          # UTF-8, og det her fejler med "No such file or directory".
          cp test.wav "røgtest æøå.wav"
          "./src/$EXE" "røgtest*.wav" -n
          # Og den anden vej: danske tegn i selve mønsteret.
          "./src/$EXE" "røgtest æøå.*" -n

      - name: Upload færdig exe
        uses: actions/upload-artifact@v4
        with:
          name: sox_ng-win64-static
          path: |
            ${{ env.SRC }}/src/*.exe
            ${{ env.SRC }}/COPYING
            ${{ env.SRC }}/ChangeLog
